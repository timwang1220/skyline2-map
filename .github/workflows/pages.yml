name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SOURCE_REVISION: ${{ github.sha }}
          VITE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq 'any(.artifacts[]; .name == "github-pages" and (.expired | not))')" == true ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Pages artifact is still unavailable."
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v5
